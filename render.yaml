services:
  - type: web
    name: ocean-pulse
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: fallback
      - key: DATABASE_URL
        fromDatabase:
          name: ocean-pulse-db
          property: connectionString

databases:
  - name: ocean-pulse-db
    plan: free
    region: singapore
    databaseName: oceanpulse
    user: oceanpulse_admin
